<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthFirst - Profile</title>
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/profile.js"></script>
</head>
<body>
  <div class="container auth">
    <h1>Your Profile</h1>
    <form id="profileForm">
      <div class="field">
        <label for="firstname">First name</label>
        <input id="firstname" name="firstname" type="text" required />
      </div>
      <div class="field">
        <label for="lastname">Last name</label>
        <input id="lastname" name="lastname" type="text" required />
      </div>
      <div class="field">
        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="0" max="150" required />
      </div>
      <div class="field">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="M">Male</option>
          <option value="F">Female</option>
        </select>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="row">
        <a class="btn" href="/index.html" style="text-decoration:none;align-items:center;display:inline-flex">Back</a>
        <button type="submit" class="btn primary">Save</button>
      </div>
      <div id="profileError" class="error"></div>
    </form>
  </div>
</body>
</html>
