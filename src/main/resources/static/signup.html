<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthFirst - Sign Up</title>
    <link rel="stylesheet" href="/styles.css">
    <script defer src="/signup.js"></script>
  </head>
  <body>
    <div class="container auth">
      <h1>Create your account</h1>
      <form id="signupForm">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" required />
        </div>
        <div class="field">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" name="confirm" type="password" minlength="6" required />
        </div>
        <button type="submit" class="btn primary">Sign Up</button>
        <div id="signupError" class="error" role="alert" aria-live="polite"></div>
      </form>
      <p class="muted" style="margin-top:12px;">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </body>
  </html>
