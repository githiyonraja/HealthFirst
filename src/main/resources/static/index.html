<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthFirst - Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/app.js"></script>
</head>
<body>
  <div class="container">
    <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h1 style="margin: 0;">Dashboard</h1>
      <div class="row">
        <span class="muted" id="helloUser"></span>
        <button id="logoutBtn" class="btn">Logout</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Daily Steps</h2>
        <div class="toolbar">
          <div class="field">
            <label for="stepsDate">Date</label>
            <input type="date" id="stepsDate">
          </div>
          <div class="field">
            <label for="stepsValue">Steps</label>
            <input type="number" id="stepsValue" min="0" placeholder="e.g. 8000">
          </div>
          <button id="saveSteps" class="btn primary">Save</button>
        </div>
        <table>
          <thead><tr><th>Date</th><th>Steps</th></tr></thead>
          <tbody id="stepsTable"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Calories</h2>
        <div class="toolbar">
          <div class="field">
            <label for="calDate">Date</label>
            <input type="date" id="calDate">
          </div>
          <div class="field">
            <label for="calIn">Calories In</label>
            <input type="number" id="calIn" min="0" placeholder="e.g. 2200">
          </div>
          <div class="field">
            <label for="calOut">Calories Out</label>
            <input type="number" id="calOut" min="0" placeholder="e.g. 500">
          </div>
          <button id="saveCalories" class="btn primary">Save</button>
        </div>
        <table>
          <thead><tr><th>Date</th><th>In</th><th>Out</th></tr></thead>
          <tbody id="calTable"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>Weight</h2>
        <div class="toolbar">
          <div class="field">
            <label for="wDate">Date</label>
            <input type="date" id="wDate">
          </div>
          <div class="field">
            <label for="wValue">Weight (kg)</label>
            <input type="number" id="wValue" step="0.1" min="0" placeholder="e.g. 72.5">
          </div>
          <button id="saveWeight" class="btn primary">Save</button>
        </div>
        <table>
          <thead><tr><th>Date</th><th>Weight (kg)</th></tr></thead>
          <tbody id="wTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>Today Summary</h2>
      <div id="todaySummary" class="muted">Loading...</div>
    </div>
  </div>
</body>
</html>
