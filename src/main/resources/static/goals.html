<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthFirst - Goals</title>
  <link rel="stylesheet" href="/styles.css" />
  <script defer src="/goals.js"></script>
</head>
<body>
  <div class="container">
    <div class="row" style="justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h1 style="margin:0;">Goals</h1>
      <div class="row">
        <a class="btn" href="/index.html" style="text-decoration:none;align-items:center;display:inline-flex">Back</a>
        <button id="logoutBtn" class="btn">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2>Add Goal</h2>
      <div class="row">
        <div class="field">
          <label for="primaryGoal">Primary Goal</label>
          <input id="primaryGoal" type="text" placeholder="e.g. Lose weight" />
        </div>
        <div class="field">
          <label for="goalWeight">Goal Weight (kg)</label>
          <input id="goalWeight" type="number" step="0.1" min="0" placeholder="e.g. 70" />
        </div>
        <button id="saveGoal" class="btn primary">Save</button>
      </div>
      <div id="goalError" class="error"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <h2>Your Goals</h2>
      <table>
        <thead><tr><th>ID</th><th>Primary Goal</th><th>Goal Weight (kg)</th></tr></thead>
        <tbody id="goalsTable"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
